<html lang="en">

<head>
    <meta charset="utf-8" />

    <style>
        *,
        *::before,
        *::after {

            margin: 0;
            padding: 0;
            box-sizing: border-box;

        }


        html {
            scroll-behavior: smooth;
            overflow-y: scroll;
        }


        body {
            min-height: 100vh;
            overflow-x: hidden;
            scrollbar-width: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;


        }

        input[type="password"]::-ms-reveal,
        input[type="password"]::-webkit-credentials-auto-fill-button {
            display: none;
        }

        :root {
            --white: white;
            --black: black;
            --red: #A63446;
            --alabaster-grey: #cfdbd5ff;
            --soft-linen: #e8eddfff;
            --tuscan-sun: rgb(255, 229, 156);
            --carbon-black: #242423ff;
            --darkgreylight: rgb(49, 49, 52);
            --darkgrey: rgb(31, 30, 32);
            --greylight: #8b8b8b;

            --light-grey: rgb(224, 226, 233);
            --accent: #5d9cff;
            --accent2: #ff6b6b;
            --accent3: #54d9a8;
            --text: #f0f4ff;
            --muted: #7a87a0;
            --correct: #54d9a8;
            --wrong: #ff6b6b;
            --border-color: #2e2e3a;
            --accent: #7c6af7;
            --accent-dim: rgba(124, 106, 247, 0.15);
            --text: #e8e8f0;
            --text-muted: #6b6b80;
            --surface: #16161e;
            --danger: #f76a6a;
            --danger-dim: rgba(247, 106, 106, 0.12);
            --highlightgreen: #ceff79;
            --addbtn: rgb(70, 101, 45);

            --fontdefault: 12px;
        }

        .screen {
            display: none;
            max-width: 70%;

            min-height: 100vh;
            margin: auto;
            background-color: transparent;
            animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);

        }



        .screen.active {
            display: flex;
            animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeUp {
            0% {
                opacity: 0.00;
                transform: translateY(24px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }

        }



        #header {
            width: 100%;
            height: 60px;

            display: flex;
            align-items: center;
            padding: 10px 15px 10px 15px;
            position: fixed;
            background-color: var(--muted);
            z-index: 999;

        }

        #home-screen {
            flex-direction: column;
            overflow: hidden;

            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .btn-container-home {
            display: flex;
            flex-direction: column;
            gap: 30px;
            margin-top: 100px;
        }

        .btn {
            width: 200px;
            height: 30px;
            background-color: var(--muted);
            border: none;
            outline: none;
            color: white;
            border-radius: 0px;
            font-weight: 600;
        }

        .btn:hover {

            background-color: #9ba7bc;
        }

        .btn:active {
            transform: scale(0.95);
            transition: transform 0.3s ease-out;
        }


        .back {
            width: 40px;
            height: 40px;
            background-color: var(--muted);

            outline: none;
            color: white;
            border-radius: 0px;
            font-weight: 600;
        }

        /* ══════════════════ Category ════════════════════════════════════════════════════════════════════════════════════════════  */

        #category-screen {
            flex-direction: column;
            overflow: hidden;
            align-items: center;
            text-align: center;
            position: relative;
            padding-top: 30px;
        }

        #category-header {
            width: 100%;
            height: 170px;

            display: flex;
            align-items: end;
            gap: 30px;
            position: absolute;
            top: 0px;
            padding-bottom: 30px;
            background-color: white;

        }



        .wrapper {
            display: flex;
            align-items: center;
            position: relative;
            transform: scale(1);
            transition: transform 0.5s ease;
            gap: 20px;
        }

        .search-icon {
            position: absolute;
            left: 10px;
            color: white;
            z-index: 4;
        }



        #category-searchBar {
            width: 260px;
            height: 35px;
            border: none;
            outline: none;
            border-radius: 5px;
            background-color: var(--muted);
            padding-left: 35px;
            color: white;
            transform: scale(1);
            transition: transform 0.5s ease;

        }

        #category-searchBar::placeholder {
            color: white;
            opacity: 0.7;

        }

        #category-grid {
            display: flex;
            flex-direction: column;

            width: 100%;
            align-items: center;
            gap: 30px;
            padding: 160px 0 30px 0;

            overflow-y: auto;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        #category-grid::-webkit-scrollbar {
            display: none;
        }

        .category-card-btn {
            width: 90%;
            height: auto;
            background-color: white;
            border-radius: 0px;
            display: flex;
            align-items: center;
            padding: 20px;
            border: solid 1px var(--muted);
            gap: 20px;
        }

        .category-card-btn:hover {

            border-color: #b1bbcc;
            color: #b1bbcc;
        }


        /* ══════════════════ Quiz ════════════════════════════════════════════════════════════════════════════════════════════  */


        #quiz-screen {
            flex-direction: column;
            overflow: hidden;

            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;

        }

        .quiz-header {

            width: 100%;
            height: 60px;

            display: flex;
            align-items: center;
            gap: 17px;

        }

        .quiz-category-tag {
            width: 70%;
            height: auto;
            padding: 10px;
            display: flex;
            align-items: center;
            flex: 1;

        }

        .timer-container {
            width: 50px;
            height: 50px;
            position: relative;
        }

        .timer-svg {
            transform: rotate(-90deg);
            width: 50px;
            height: 50px;
        }

        .timer-track {
            fill: none;
            stroke: #e0e0e0;
            stroke-width: 4;
        }

        .timer-progress {
            fill: none;
            stroke: #65ba6d;
            stroke-width: 4;
            stroke-linecap: square;
            stroke-dasharray: 126;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 1s linear, stroke 0.3s;
        }

        .timer-progress.warning {
            stroke: #ff9800;
        }

        .timer-progress.danger {
            stroke: #f44336;
        }

        .timer-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 14px;
            font-weight: bold;
            color: #333;
        }

        .question-card {
            width: 100%;
            height: fit-content;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding: 30px;
            margin-top: 30px;
            gap: 20px;
            border-radius: 5px;

            overflow: hidden;
            animation: sideFade 0.5s cubic-bezier(0.16, 1, 0.3, 1);


        }

        .q-text {
            max-height: 100px;
            overflow: hidden;
            text-align: left;
            margin-bottom: 30px;
            word-break: break-word;
        }

        @keyframes sideFade {
            0% {
                opacity: 0.00;
                transform: translateX(24px);
            }

            100% {
                opacity: 1;
                transform: translateX(0);
            }

        }

        .opt-grid {
            width: 100%;
            height: fit-content;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(4, auto);
            gap: 10px;
        }


        .opt-btn {
            width: 100%;
            max-width: 100%;
            background-color: white;
            border: solid 1px var(--muted);
            color: black
        }

        .opt-btn:hover {
            border-color: #9ba7bc;
            background-color: white;
        }

        /* ══════════════════ Result ════════════════════════════════════════════════════════════════════════════════════════════  */

        #result-screen {
            flex-direction: column;
            overflow: hidden;

            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            gap: 24px;

        }

        .result-stat-row {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 32px;
        }

        .result-stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .result-stat-val {
            font-size: 2rem;
            font-weight: bold;
        }

        .result-stat.center .result-stat-val {
            font-size: 3.5rem;
        }

        .result-stat-key {
            font-size: 0.85rem;
            opacity: 0.7;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .result-secondary {
            display: flex;
            gap: 24px;
            font-size: 0.9rem;
            opacity: 0.6;
        }

        .result-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }


        /* ── ADMIN LOGIN ────────────────────────────────────────────────── */


        #open-modal-btn {
            width: 100px;
            height: 30px;
            background-color: white;
            border: none;
            outline: none;
            color: var(--muted);
            border-radius: 0px;
            font-weight: 600;
            margin-left: auto;

        }

        #admin-modal {
            width: 300px;
            height: fit-content;

            padding: 20px;
            margin: auto;
            background-color: white;
            border: solid 1px var(--muted);
            gap: 30px;
        }

        #admin-modal[open] {

            display: flex;
            flex-direction: column;
            align-items: center;

        }

        #admin-modal-close-btn {
            width: 20px;
            height: 20px;
            outline: none;
            border: none;
            background-color: transparent;
            margin-left: auto;
        }

        #admin-modal-back-btn:hover {
            background-color: rgba(255, 255, 255, 0.322);
        }

        .input-field {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            font-size: small;
            gap: 5px;
            position: relative;
        }


        #admin-pass-input {

            width: 100%;
            height: 25px;
            border: solid 1px var(--muted);
            outline: none;
            padding-left: 10px;

        }


        #admin-pass-err {
            display: none;
            color: red;
            background-color: white;
            padding: 0px;
            position: absolute;
            top: 48px;
            font-size: 10px;

        }

        #admin-pass-err.active {
            display: flex;
        }

        #toggle-btn {
            position: absolute;
            top: 24px;
            right: -25px;
            border: none;
            background-color: transparent;
            outline: none;
        }

        #toggle-btn * {
            pointer-events: none;
        }

        .eye-open {
            color: var(--muted);
        }

        .eye-close {
            color: #9da9bf;
        }

        #admin-login-btn {
            width: 30%;
            height: 30px;
            border: none;
            background-color: var(--muted);
            color: white;
        }


        /* ══════════════════ ADMIN ════════════════════════════════════════════════════════════════════════════════════════════  */


        #admin-screen {
            max-width: 180vh;
            flex-direction: column;
            padding-top: 100px;
            position: relative;
            gap: 20px;
            padding: 0 40px;
        }

        #admin-header {
            display: flex;
            align-items: center;
        }

        .logout-btn {
            width: 100px;
            height: 30px;
            margin-left: auto
        }

        #admin-nav {
            width: fit-content;

            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            border: solid 1px var(--muted);
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .admin-tab {
            width: 120px;
            height: 30px;

            border: none;
            background-color: transparent;
            color: var(--muted);
            border-radius: 7px;
            transition: background-color 0.2s;

        }

        .admin-tab.active {
            background-color: var(--darkgreylight);
            color: white;
        }

        .tab-panel {
            display: none;
        }

        .tab-panel.active {
            display: flex;
        }

        /* ── QUESTION TAB ────────────────────────────────────────────────── */
        #question-tab {
            flex-direction: row;
            gap: 0;
            position: relative;
            overflow: hidden;
            align-items: flex-start;
        }

        /* left side: filters + table */
        #question-main {
            display: flex;
            flex-direction: column;
            flex: 1;
            gap: 20px;
            min-width: 0;
            width: 100%
        }

        .des1 {
            height: 30px;
            outline: none;
            border: none;
            background-color: var(--darkgreylight);
            color: white;
            width: 120px;
            min-width: 90px;
            border-radius: 8px;
            font-size: 12px;
            padding: 0 10px;
        }



        .add-btn {

            background: linear-gradient(to right, var(--addbtn), var(--highlightgreen));
            margin-left: auto;
            position: relative;
            cursor: pointer;
        }

        .tooltip-fade {
            position: absolute;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%) translateY(6px);

            background: #334155;
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            white-space: nowrap;

            opacity: 0;
            pointer-events: none;
            transition: opacity .3s ease, transform .3s ease;
        }

        .add-btn:hover .tooltip-fade {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ── question-table ────────────────────────────────────────────────── */

        #table-wrapper {
            max-height: 74.2vh;
            overflow-y: auto;
            scrollbar-width: none;
            border-radius: 10px;
        }

        #question-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 13px;
            color: rgb(196, 196, 196);
            table-layout: auto;
        }

        #question-table thead tr {
            background: var(--darkgrey);
            position: sticky;
            top: 0;
            z-index: 1;
        }

        #question-table th {
            padding: 8px 12px;
            text-align: left;
            font-size: 12px;
            font-weight: 500;
            color: white;
            border-bottom: 1px solid var(--greylight);
            border-right: 1px solid var(--greylight);
        }

        #question-table th:last-child,
        #question-table th:nth-last-child(2) {
            border-right: none;
        }

        #question-table td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--greylight);
            border-right: 1px solid var(--greylight);
            background: var(--darkgreylight);
            vertical-align: top;
        }

        #question-table td:last-child,
        #question-table td:nth-last-child(2) {
            border-right: none;
        }

        #question-table td:nth-last-child(3) {
            max-width: 200px;
        }

        tr:hover td {
            background: rgb(99, 99, 103);
        }

        .badge {
            border-radius: 20px;
            padding: 0px 10px 3px 10px;
            background-color: #57575b;
        }

        .cat-math {
            background-color: rgb(223, 239, 217);
            color: #284e22
        }

        .cat-science {
            background-color: rgb(255, 243, 230);
            color: #592c1c;
        }

        .cat-geography {
            background-color: rgb(255, 250, 233);
            color: #594e1c;
        }

        .cat-flags {
            background-color: rgb(213, 216, 234);
            color: #1c3759;
        }

        .cat-animals {
            background-color: rgb(236, 255, 202);
            color: #43591c;
        }

        .diff-easy {
            background-color: rgb(201, 222, 192);
            color: #3d6438
        }

        .diff-medium {
            background-color: rgb(216, 211, 192);
            color: #543a21
        }

        .diff-hard {
            background-color: rgb(220, 197, 198);
            color: #533030;
        }

        .question-text {
            color: white;
            margin-bottom: 10px;
        }

        .opt-list {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .opt {
            display: flex;
            gap: 10px;
            margin-left: 5px;
        }

        .opt.correct {
            color: var(--highlightgreen);
        }

        .action-btn {
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 30px;
            height: auto;
            border-radius: 3px;
            border: none;
            color: var(--white);
            background-color: transparent;
            font-size: 12px;
            font-weight: 700;
            padding-bottom: 5px;
            border: solid 1px var(--greylight)
        }

        #question-tab button:active {
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        /* ── q-form ────────────────────────────────────────────────── */


        #q-form {
            width: 0;
            min-width: 0;

            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex-shrink: 0;
            border: none;
            border-radius: 10px;
            gap: 30px;
            padding: 0;

            transition: width 0.3s cubic-bezier(0.075, 0.82, 0.165, 1), padding 0.3s cubic-bezier(0.075, 0.82, 0.165, 1);



        }

        #q-form.active {
            width: 420px;
            margin-left: 40px;
            padding: 20px;
            border: solid 1px var(--darkgreylight);
            transition: width 0.3s cubic-bezier(0.075, 0.82, 0.165, 1), padding 0.3s cubic-bezier(0.075, 0.82, 0.165, 1);


        }




        @keyframes faa {
            0% {
                opacity: 0.00;

            }

            100% {
                opacity: 1;

            }

        }

        .form-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 20px;
            border-bottom: var(--darkgreylight);
        }

        .form-header .icon {
            width: 32px;
            height: 32px;
            background: rgb(95, 96, 101);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .form-header .icon svg {
            width: 16px;
            height: 16px;
            stroke: white;
        }

        .form-header h2 {
            font-size: 15px;
            font-weight: 600;
            color: var(--darkgreylight);
            letter-spacing: -0.02em;
        }

        .form-err-text {
            display: none;
            color: red;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
        }



        #q-form label {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            font-family: 'DM Mono', monospace;
        }

        #q-text,
        #q-form select,
        #q-form input[type="text"] {
            background: transparent;
            border: solid 1px var(--darkgreylight);
            border-radius: 5px;
            color: black;
            font-family: 'DM Sans', sans-serif;
            font-size: 12px;
            outline: none;
            width: 100%;
            appearance: none;
            -webkit-appearance: none;
        }

        #q-text {
            resize: vertical;
            min-height: 88px;
            line-height: 1.6;
            max-height: 300px;
            padding: 10px 14px;
        }

        #q-text::placeholder,
        #q-form input[type="text"]::placeholder,
        #q-form select {
            color: var(--text-muted);
        }

        .option-item input[type="text"]:focus {
            border: none;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 8px;
            border-radius: 8px;
            padding: 8px 12px;
            transition: border-color 0.5s;
            background: transparent;
            border: solid 1px;
            border-color: transparent;
            position: relative;
        }

        .option-item:focus-within {
            border-color: var(--darkgreylight);
        }

        .option-badge {
            width: 22px;
            height: 22px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-muted);
            font-family: 'DM Mono', monospace;
            flex-shrink: 0;
        }

        .option-item input[type="text"] {
            height: 30px;
            padding-left: 10px;
        }

        .bottom-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 20px;

        }

        #hint {
            height: 30px;
            width: auto;
            padding-left: 10px;
            margin-right: 100px;
        }

        #q-form select {
            height: 30px;
            width: auto;
            padding-left: 10px;

        }

        .actions {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding-top: 8px;
            border-top: var(--darkgreylight);
        }

        #q-form button {
            height: 30px;
            font-family: 'DM Sans', sans-serif;
            font-size: 12px;
            font-weight: 500;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: opacity 0.15s, transform 0.1s, box-shadow 0.15s;
            padding: 5px 40px 5px 10px;
        }

        #q-form button:active {
            transform: scale(0.97);
        }

        #btn-cancel {
            background-color: var(--danger);
            color: rgb(255, 255, 255);
        }


        #btn-cancel:hover {
            opacity: 0.9;
            box-shadow: 4px 4px 3px rgba(68, 68, 68, 0.3);
        }

        #btn-add {
            background: var(--accent);
            color: #fff;
        }

        #btn-add:hover {
            opacity: 0.9;
            box-shadow: 4px 4px 3px rgba(68, 68, 68, 0.3);
        }

        #form-err-text {
            position: relative;
        }

        .form-err {
            color: red;
            display: none;
            position: absolute;
            font-size: 12;
        }

        .form-err.active {
            display: flex;
        }

        .form-err.q-err {
            left: 70px;
            top: -1px;
        }

        .form-err.option-err {
            left: 60px;
            top: -1px;
        }

        .form-err.ans-err {
            left: 112px;
            top: -1px;
        }

        .form-err.cat-err {
            left: 80px;
        }

        .form-err.diff-err {
            left: 80px;
        }

        /* ── CATEGORY TAB ────────────────────────────────────────────────── */

        #category-tab {
            flex-direction: column;
            gap: 30px;
        }

        #category-tab .field-group {
            gap: 30px;
        }

        #add-category-btn {
            margin-left: auto;
        }

        #admin-cat-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
        }

        .admin-cat-card {
            width: 200px;
            max-width: 200px;
            height: 300px;
            display: flex;
            flex-direction: column;

            border-radius: 5px;
            font-size: 12px;
            overflow: hidden;
            gap: 20px;
            padding: 20px;
            border: solid 1px;
            position: relative;
            background-color: var(--darkgreylight);
            color: white;
            transition: all 0.3s ease;
            /* ADD THIS */
        }

        .admin-cat-card.empty-card {

            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
        }

        .admin-cat-card:hover {
            transform: scale(1.03);
            transition: transform 0.4s ease;
        }

        .cat-card-img {
            width: 95%;
            height: 150px;
            object-fit: cover;
            border-radius: 3px;
            position: absolute;
            top: 5;
            align-self: center;
        }

        .img-fallback {
            width: 100%;
            height: 200px;
            display: none;
            align-items: center;
            justify-content: center;
            background-image: url('https://www.example.com/default-image.jpg');
            color: #888;
            font-size: 14px;
            text-align: center;
        }

        #admin-cat-wrapper .field-group {
            gap: 15px;
            margin-top: 150px;
        }

        @media (max-width: 480px) {
            .opt-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 1110px) {
            #question-tab.active {

                flex-direction: column;
            }

            #q-form.active {
                width: 100%;
                margin-top: 30px;
                margin-left: 0;
                padding: 20px 50px;
            }
        }
    </style>
</head>


<body>

    <div id="header"><button id="open-modal-btn">admin</button></div>

    <!-- ════════════════════════════════════════════════════════
     SCREEN: HOME
     ════════════════════════════════════════════════════════ -->
    <div class="screen active" id="home-screen">
        <h2>Test your Knowledge</h2>
        <div class="btn-container-home">
            <button class="btn play">play</button>
            <button class="btn">hi po</button>
        </div>
    </div>

    <!-- ════════════════════════════════════════════════════════
     SCREEN: CATEGORY
     ════════════════════════════════════════════════════════ -->
    <div class="screen" id="category-screen">
        <div id="category-header">
            <button class="btn back">&lt;</button>
            <h1>Categories</h1>
            <div class="wrapper" style="margin-left: auto">
                <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8" />
                    <line x1="21" y1="21" x2="16.65" y2="16.65" />
                </svg>
                <input type="text" id="category-searchBar" placeholder="search topic">
            </div>
        </div>
        <div id="category-grid"></div>
    </div>

    <!-- ═══════════════════════════════════════════════════════════════════════════════════════════════════════
     SCREEN: QUIZ
     ═══════════════════════════════════════════════════════════════════════════════════════════════════════════ -->
    <div class="screen" id="quiz-screen">
        <div class="quiz-header">
            <button class="btn back">&lt;</button>
            <div class="quiz-category-tag"></div>
            <div class="timer-container">
                <svg class="timer-svg" viewBox="0 0 44 44">
                    <circle class="timer-track" cx="22" cy="22" r="20" />
                    <circle class="timer-progress" cx="22" cy="22" r="20" />
                </svg>
                <span class="timer-text">0</span>
            </div>
        </div>
        <div class="question-card"></div>
    </div>

    <!-- ═══════════════════════════════════════════════════════════════════════════════════════════════════════
     SCREEN: RESULT
     ═══════════════════════════════════════════════════════════════════════════════════════════════════════════ -->
    <div class="screen" id="result-screen">
        <div class="result-stat-row">
            <div class="result-stat">
                <div class="result-stat-val" id="res-mistakes" style="color:var(--wrong)">0</div>
                <div class="result-stat-key">Mistakes</div>
            </div>
            <div class="result-stat center">
                <div class="result-stat-val main-score" id="res-correct" style="color:var(--correct)">0</div>
                <div class="result-stat-key">Score</div>
            </div>
            <div class="result-stat">
                <div class="result-stat-val" id="res-accuracy" style="color:var(--accent)">0%</div>
                <div class="result-stat-key">Accuracy</div>
            </div>
        </div>

        <div class="result-secondary">
            <span id="res-total">📋 0 Questions</span>
            <span id="res-time">⏱ 0:00</span>
        </div>

        <div class="result-actions">
            <button class="btn retry">↺ Retry</button>
            <button class="btn goCat">New Category</button>
            <button class="btn back" style="width: 200px;">🏠 Home</button>
        </div>
    </div>

    <!-- ═════════════════════════════════════════════════════════════════════════════════════════════════════
     SCREEN: ADMIN SCREEN
     ═════════════════════════════════════════════════════════════════════════════════════════════════════════ -->
    <div class="screen active" id="admin-screen">

        <div id="admin-header">
            <h1>Work Space</h1>
            <button class="logout-btn">logout</button>
        </div>

        <div id="admin-nav">
            <button class="admin-tab active" data-tab="question">questions</button>
            <button class="admin-tab" data-tab="category">categories</button>
            <button class="admin-tab" data-tab="settings">settings</button>
        </div>

        <!-- QUESTION TAB  ═══════════════════════════════════════════════════════════════════════════════════-->
        <div class="tab-panel active" id="question-tab">

            <!-- LEFT: filters + table -->
            <div id="question-main">
                <h1>Questions</h1>

                <div class="wrapper">
                    <select class="des1" id="cat-filter">
                        <option value="">All categories</option>
                    </select>
                    <select class="des1" id="diff-filter">
                        <option value="">All difficulty</option>
                        <option value="easy">easy</option>
                        <option value="medium">medium</option>
                        <option value="hard">hard</option>
                    </select>
                    <button class="des1 add-btn" id="add-question-btn">
                        + Add Questions
                        <span class="tooltip-fade">Add Questions</span>
                    </button>
                </div>

                <div id="table-wrapper">
                    <table id="question-table">
                        <colgroup>
                            <col style="width: 50px;">
                            <col style="width: 150px; min-width: 100px; ">
                            <col style="width: 120px; min-width: 80px;">
                            <col style="width: 100px; min-width: 50px;">
                            <col style="width: auto; min-width: 220px;">
                            <col style="width: 65px; min-width: 30px;">
                        </colgroup>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Category</th>
                                <th>Difficulty</th>
                                <th>Options</th>
                                <th>Question</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="question-tbody"></tbody>
                    </table>
                </div>
            </div>

            <!-- RIGHT: q-form slides in -->
            <form id="q-form">
                <div class="form-header">
                    <div class="icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10" />
                            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
                            <line x1="12" y1="17" x2="12.01" y2="17" />
                        </svg>
                    </div>
                    <h2>Add Question</h2>
                </div>

                <p class="form-err" id="form-err-text">* Field with asterisk(*) is required</p>

                <div class="field-group">
                    <label>Question</label>
                    <textarea id="q-text" placeholder="Type your question here…"></textarea>
                    <span class="form-err q-err">*</span>
                </div>

                <div class="field-group">
                    <label>Options</label>
                    <div class="options-grid">
                        <div class="option-item">
                            <span class="option-badge">A</span>
                            <input type="text" id="opt-a" placeholder="Option A" />
                        </div>
                        <div class="option-item">
                            <span class="option-badge">B</span>
                            <input type="text" id="opt-b" placeholder="Option B" />
                        </div>
                        <div class="option-item">
                            <span class="option-badge">C</span>
                            <input type="text" id="opt-c" placeholder="Option C" />
                        </div>
                        <div class="option-item">
                            <span class="option-badge">D</span>
                            <input type="text" id="opt-d" placeholder="Option D" />
                        </div>
                    </div>
                    <span class="form-err option-err">*</span>
                </div>

                <div class="bottom-row">
                    <div class="field-group">
                        <label>Difficulty</label>
                        <select id="q-diff">
                            <option value="" disabled selected>Select…</option>
                            <option value="easy">Easy</option>
                            <option value="medium">Medium</option>
                            <option value="hard">Hard</option>
                        </select>
                        <span class="form-err diff-err">*</span>
                    </div>

                    <div class="field-group">
                        <label>Correct Answer</label>
                        <select id="q-answer">
                            <option value="" disabled selected>Select…</option>
                            <option value="A">A</option>
                            <option value="B">B</option>
                            <option value="C">C</option>
                            <option value="D">D</option>
                        </select>
                        <span class="form-err ans-err">*</span>
                    </div>

                    <div class="field-group">
                        <label>Categories</label>
                        <select id="q-form-cat">
                            <option value="" disabled selected>Select…</option>
                        </select>
                        <span class="form-err cat-err">*</span>
                    </div>

                    <div class="field-group">
                        <label>Hint</label>
                        <input type="text" id="hint" placeholder="Hint (optional)">
                        <span class="form-err">*</span>
                    </div>
                </div>

                <div class="actions">
                    <button id="btn-cancel" type="button">Cancel</button>
                    <button id="btn-add" type="submit">Add Question</button>
                </div>
            </form>

        </div>
        <!-- CATEGORY TAB  ═══════════════════════════════════════════════════════════════════════════════════-->


        <div class="tab-panel" id="category-tab">
            <div class="field-group">
                <div class="wrapper">
                    <h1>Categories</h1>
                    <button class="des1" id="add-category-btn"> + add Category</button>
                </div>
                <div id="admin-cat-wrapper">
                    <div class="admin-cat-card empty-card">no category yet</div>
                </div>
            </div>
        </div>

        <div class="tab-panel" id="settings-tab"></div>

    </div>

    <dialog id="admin-modal">
        <button id="admin-modal-close-btn">X</button>
        <h1>Login</h1>
        <div class="input-field">
            <label for="admin-pass-input">Password - manchild123</label>
            <input type="password" id="admin-pass-input">
            <button id="toggle-btn" aria-label="show password">
                <svg class="eye-close" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                    <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                    <line x1="1" y1="1" x2="23" y2="23" />
                </svg>
            </button>
            <span id="admin-pass-err"></span>
        </div>
        <button id="admin-login-btn">LOGIN</button>
    </dialog>

    <script type="module" src="script.js"></script>
</body>

</html>
