<html lang="en">

<head>
    <meta charset="utf-8" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />

    <style>
        /* ════════════════════════════════════════════════════════
           RESET
           ════════════════════════════════════════════════════════ */

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ════════════════════════════════════════════════════════
           VARIABLES
           ════════════════════════════════════════════════════════ */

        :root {
            --white: white;
            --black: black;
            --red: #a63446;
            --alabaster-grey: #cfdbd5ff;
            --soft-linen: #e8eddfff;
            --tuscan-sun: rgb(255, 229, 156);
            --carbon-black: #242423ff;
            --darkgreylight: rgb(49, 49, 52);
            --darkgrey: rgb(31, 30, 32);
            --greylight: #8b8b8b;
            --light-grey: rgb(224, 226, 233);
            --muted: #7a87a0;
            --accent: #7c6af7;
            --accent-dim: rgba(124, 106, 247, 0.15);
            --accent2: #ff6b6b;
            --accent3: #54d9a8;
            --text: #e8e8f0;
            --text-muted: #6b6b80;
            --surface: #16161e;
            --correct: #54d9a8;
            --wrong: #ff6b6b;
            --danger: #f76a6a;
            --danger-dim: rgba(247, 106, 106, 0.12);
            --highlightgreen: #ceff79;
            --addbtn: rgb(70, 101, 45);
            --border-color: #2e2e3a;
            --fontdefault: 12px;
        }

        /* ════════════════════════════════════════════════════════
           BASE
           ════════════════════════════════════════════════════════ */

        html {
            scroll-behavior: smooth;
            overflow-y: scroll;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
            scrollbar-width: none;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        input[type="password"]::-ms-reveal,
        input[type="password"]::-webkit-credentials-auto-fill-button {
            display: none;
        }

        /* ════════════════════════════════════════════════════════
           ANIMATIONS
           ════════════════════════════════════════════════════════ */

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(24px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes sideFade {
            0% {
                opacity: 0;
                transform: translateX(24px);
            }

            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* ════════════════════════════════════════════════════════
           SHARED / REUSABLE
           ════════════════════════════════════════════════════════ */




        .screen {
            display: none;
            max-width: 70%;
            min-height: 100vh;
            margin: auto;
            background-color: transparent;
        }

        .screen.active {
            display: flex;
            animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }



        .btn {
            border: none;
            outline: none;
            color: white;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn--primary {
            background-color: var(--darkgreylight);
            color: var(--white);
        }

        .btn--secondary {
            background: var(--accent);
            color: var(--white);
        }

        .btn--danger {
            background-color: var(--danger);
            color: var(--white);
        }

        .btn:active {
            transform: scale(0.95);
            transition: transform 0.3s ease-out;
        }

        .size--sm {
            width: 80px;
            min-width: 60px;
            height: 20px;
            padding: 0 6px;

        }

        .size--md {
            width: 120px;
            min-width: 90px;
            height: 30px;
            padding: 0 10px;

        }

        .size--long {
            width: 200px;
        }

        .select {
            background-color: var(--darkgreylight);
            border-radius: 8px;
            color: white;

        }

        .back {
            width: 40px;
            height: 40px;
            background-color: var(--muted);
            outline: none;
            color: white;
            border-radius: 0px;
            font-weight: 600;
        }

        .wrapper {
            display: flex;
            align-items: center;
            position: relative;
            gap: 20px;
        }

        .badge {
            border-radius: 20px;
            padding: 0px 10px 3px 10px;
            background-color: #57575b;
        }

        /* ════════════════════════════════════════════════════════
           HEADER
           ════════════════════════════════════════════════════════ */

        #header {
            width: 100%;
            height: 60px;
            display: flex;
            align-items: center;
            padding: 10px 15px;
            position: fixed;
            background-color: var(--muted);
            z-index: 999;
        }

        /* ════════════════════════════════════════════════════════
           SCREEN: HOME
           ════════════════════════════════════════════════════════ */

        #home-screen {
            flex-direction: column;
            overflow: hidden;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .btn-container-home {
            display: flex;
            flex-direction: column;
            gap: 30px;
            margin-top: 100px;
        }

        /* ════════════════════════════════════════════════════════
           SCREEN: CATEGORY
           ════════════════════════════════════════════════════════ */

        #category-screen {
            flex-direction: column;
            overflow: hidden;
            align-items: center;
            text-align: center;
            position: relative;
            padding-top: 30px;
        }

        #category-header {
            width: 100%;
            height: 170px;
            display: flex;
            align-items: end;
            gap: 30px;
            position: absolute;
            top: 0px;
            padding-bottom: 30px;
            background-color: white;
        }

        .search-icon {
            position: absolute;
            left: 10px;
            color: white;
            z-index: 4;
        }

        #category-searchBar {
            width: 260px;
            height: 35px;
            border: none;
            outline: none;
            border-radius: 5px;
            background-color: var(--muted);
            padding-left: 35px;
            color: white;
        }

        #category-searchBar::placeholder {
            color: white;
            opacity: 0.7;
        }

        #category-grid {
            display: flex;
            flex-direction: column;
            width: 100%;
            align-items: center;
            gap: 30px;
            padding: 160px 0 30px 0;
            overflow-y: auto;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        #category-grid::-webkit-scrollbar {
            display: none;
        }

        .category-card-btn {
            width: 90%;
            height: auto;
            background-color: white;
            border-radius: 0px;
            display: flex;
            align-items: center;
            padding: 20px;
            border: solid 1px var(--muted);
            gap: 20px;
        }

        .category-card-btn:hover {
            border-color: #b1bbcc;
            color: #b1bbcc;
        }

        /* ════════════════════════════════════════════════════════
           SCREEN: QUIZ
           ════════════════════════════════════════════════════════ */

        #quiz-screen {
            flex-direction: column;
            overflow: hidden;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
        }

        .quiz-header {
            width: 100%;
            height: 60px;
            display: flex;
            align-items: center;
            gap: 17px;
        }

        .quiz-category-tag {
            width: 70%;
            height: auto;
            padding: 10px;
            display: flex;
            align-items: center;
            flex: 1;
        }

        /* timer */
        .timer-container {
            width: 50px;
            height: 50px;
            position: relative;
        }

        .timer-svg {
            transform: rotate(-90deg);
            width: 50px;
            height: 50px;
        }

        .timer-track {
            fill: none;
            stroke: #e0e0e0;
            stroke-width: 4;
        }

        .timer-progress {
            fill: none;
            stroke: #65ba6d;
            stroke-width: 4;
            stroke-linecap: square;
            stroke-dasharray: 126;
            stroke-dashoffset: 0;
            transition:
                stroke-dashoffset 1s linear,
                stroke 0.3s;
        }

        .timer-progress.warning {
            stroke: #ff9800;
        }

        .timer-progress.danger {
            stroke: #f44336;
        }

        .timer-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 14px;
            font-weight: bold;
            color: #333;
        }

        /* question card */
        .question-card {
            width: 100%;
            height: fit-content;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding: 30px;
            margin-top: 30px;
            gap: 20px;
            border-radius: 5px;
            overflow: hidden;
            animation: sideFade 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .q-text {
            max-height: 100px;
            overflow: hidden;
            text-align: left;
            margin-bottom: 30px;
            word-break: break-word;
        }

        /* options */
        .opt-grid {
            width: 100%;
            height: fit-content;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(4, auto);
            gap: 10px;
        }

        .opt-btn {
            width: 100%;
            max-width: 100%;
            background-color: white;
            border: solid 1px var(--muted);
            color: black;
        }

        .opt-btn:hover {
            border-color: #9ba7bc;
            background-color: white;
        }

        /* ════════════════════════════════════════════════════════
           SCREEN: RESULT
           ════════════════════════════════════════════════════════ */

        #result-screen {
            flex-direction: column;
            overflow: hidden;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            gap: 24px;
        }

        .result-stat-row {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 32px;
        }

        .result-stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .result-stat-val {
            font-size: 2rem;
            font-weight: bold;
        }

        .result-stat.center .result-stat-val {
            font-size: 3.5rem;
        }

        .result-stat-key {
            font-size: 0.85rem;
            opacity: 0.7;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .result-secondary {
            display: flex;
            gap: 24px;
            font-size: 0.9rem;
            opacity: 0.6;
        }

        .result-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* ════════════════════════════════════════════════════════
           ADMIN LOGIN MODAL
           ════════════════════════════════════════════════════════ */

        #open-modal-btn {
            width: 100px;
            height: 30px;
            background-color: white;
            border: none;
            outline: none;
            color: var(--muted);
            border-radius: 0px;
            font-weight: 600;
            margin-left: auto;
        }

        #admin-modal {
            width: 300px;
            height: fit-content;
            padding: 20px;
            margin: auto;
            background-color: white;
            border: solid 1px var(--muted);
            gap: 30px;
        }

        #admin-modal[open] {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #admin-modal-close-btn {
            width: 20px;
            height: 20px;
            outline: none;
            border: none;
            background-color: transparent;
            margin-left: auto;
        }

        #admin-login-btn {
            width: 30%;
            height: 30px;
            border: none;
            background-color: var(--muted);
            color: white;
        }

        .input-field {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            font-size: small;
            gap: 5px;
            position: relative;
        }

        #admin-pass-input {
            width: 100%;
            height: 25px;
            border: solid 1px var(--muted);
            outline: none;
            padding-left: 10px;
        }

        #admin-pass-err {
            display: none;
            color: red;
            background-color: white;
            position: absolute;
            top: 48px;
            font-size: 10px;
        }

        #admin-pass-err.active {
            display: flex;
        }

        #toggle-btn {
            position: absolute;
            top: 24px;
            right: -25px;
            border: none;
            background-color: transparent;
            outline: none;
        }

        #toggle-btn * {
            pointer-events: none;
        }

        .eye-open {
            color: var(--muted);
        }

        .eye-close {
            color: #9da9bf;
        }

        /* ════════════════════════════════════════════════════════
           SCREEN: ADMIN
           ════════════════════════════════════════════════════════ */

        #admin-screen {
            max-width: 180vh;
            flex-direction: column;
            padding: 100px 40px 0 40px;
            position: relative;
            gap: 20px;
            transition: max-width 0.3s cubic-bezier(0.075, 0.82, 0.165, 1);
        }

        #admin-screen.adjust {
            max-width: 200vh;
        }

        #admin-header {
            display: flex;
            align-items: center;
        }

        .logout-btn {
            width: 100px;
            height: 30px;
            margin-left: auto;
        }

        /* admin nav tabs */
        #admin-nav {
            width: fit-content;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            border: solid 1px var(--muted);
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .admin-tab {
            width: 120px;
            height: 30px;
            border: none;
            background-color: transparent;
            color: var(--muted);
            border-radius: 7px;
            transition: background-color 0.2s;
        }

        .admin-tab.active {
            background-color: var(--darkgreylight);
            color: white;
        }

        /* tab panels */
        .tab-panel {
            display: none;
        }

        .tab-panel.active {
            display: flex;
        }

        /* ════════════════════════════════════════════════════════
           ADMIN TAB: QUESTIONS
           ════════════════════════════════════════════════════════ */

        #question-tab {
            flex-direction: row;
            gap: 0;
            position: relative;
            overflow: hidden;
            align-items: flex-start;
        }

        #question-tab button:active {
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        /* left side */
        #question-main {
            display: flex;
            flex-direction: column;
            flex: 1;
            gap: 20px;
            min-width: 0;
            width: 100%;
        }

        #add-question-btn {
            display: none;
            /* background: linear-gradient(to right,
                    var(--addbtn),
                    var(--highlightgreen)); */
            margin-left: auto;
            position: relative;
        }

        #add-question-btn.show {
            display: block;
        }

        .tooltip-fade {
            position: absolute;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%) translateY(6px);
            background: #334155;
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition:
                opacity 0.3s ease,
                transform 0.3s ease;
        }

        .add-btn:hover .tooltip-fade {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* question table */
        #table-wrapper {
            max-height: 74.2vh;
            overflow-y: auto;
            scrollbar-width: none;
            border-radius: 10px;
        }

        #question-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 13px;
            color: rgb(196, 196, 196);
            table-layout: auto;
        }

        #question-table thead tr {
            background: var(--darkgrey);
            position: sticky;
            top: 0;
            z-index: 1;
        }

        #question-table th {
            padding: 8px 12px;
            text-align: left;
            font-size: 12px;
            font-weight: 500;
            color: white;
            border-bottom: 1px solid var(--greylight);
            border-right: 1px solid var(--greylight);
        }

        #question-table th:last-child,
        #question-table th:nth-last-child(2) {
            border-right: none;
        }

        #question-table td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--greylight);
            border-right: 1px solid var(--greylight);
            background: var(--darkgreylight);
            vertical-align: top;
        }

        #question-table td:last-child,
        #question-table td:nth-last-child(2) {
            border-right: none;
        }

        #question-table td:nth-last-child(3) {
            max-width: 200px;
        }

        tr:hover td {
            background: rgb(99, 99, 103);
        }

        /* table content */
        .question-text {
            color: white;
            margin-bottom: 10px;
        }

        .opt-list {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .opt {
            display: flex;
            gap: 10px;
            margin-left: 5px;
        }

        .opt.correct {
            color: var(--highlightgreen);
        }

        .action-btn {
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 30px;
            height: auto;
            border-radius: 3px;
            border: solid 1px var(--greylight);
            color: var(--white);
            background-color: transparent;
            font-size: 12px;
            font-weight: 700;
            padding-bottom: 5px;
            pointer-events: all;
        }

        .action-popup {
            flex-direction: column;
            display: none;
            position: absolute;
            /* bottom: calc(100% + 8px); */
            left: 50%;
            top: 30;
            transform: translateX(-50%);
            /* background: var(--darkgreylight); */
            /* border: solid 1px var(--greylight); */
            border-radius: 8px;
            padding: 10px 10px 10px 10px;
            /* flex-direction: row; */
            gap: 4px;
            z-index: 99;
        }

        .tip-wrap {
            position: relative;
        }

        .tip {
            position: absolute;
            bottom: calc(100% + 6px);
            left: 50%;
            transform: translateX(-50%);
            background: var(--darkgrey);
            border: solid 1px var(--greylight);
            color: white;
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 4px;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s;
        }

        .edit-btn {
            width: 30px;
            height: 30px;
            border-radius: 6px;
            border: solid 1px var(--greylight);
            background: transparent;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: all;
        }

        .edit-btn:hover {
            background: rgb(70, 70, 73);
        }

        .remove-btn {
            width: 30px;
            height: 30px;
            border-radius: 6px;
            border: solid 1px var(--greylight);
            background: transparent;
            color: var(--danger);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: all;
        }

        .remove-btn:hover {
            background: rgba(247, 106, 106, 0.15);
        }

        /* category badges */
        .cat-math {
            background-color: rgb(223, 239, 217);
            color: #284e22;
        }

        .cat-science {
            background-color: rgb(255, 243, 230);
            color: #592c1c;
        }

        .cat-geography {
            background-color: rgb(255, 250, 233);
            color: #594e1c;
        }

        .cat-flags {
            background-color: rgb(213, 216, 234);
            color: #1c3759;
        }

        .cat-animals {
            background-color: rgb(236, 255, 202);
            color: #43591c;
        }

        /* difficulty badges */
        .diff-easy {
            background-color: rgb(201, 222, 192);
            color: #3d6438;
        }

        .diff-medium {
            background-color: rgb(216, 211, 192);
            color: #543a21;
        }

        .diff-hard {
            background-color: rgb(220, 197, 198);
            color: #533030;
        }

        /* ════════════════════════════════════════════════════════
           ADMIN TAB: QUESTIONS — Confirm Modal
           ════════════════════════════════════════════════════════ */

        #confirm-del-popup {
            width: 300px;
            height: fit-content;
            margin: auto;
            gap: 20px;
            padding: 30px;
            outline: none;
            border: none;
            border-radius: 10px;
        }

        #confirm-del-popup[open] {
            display: flex;
            flex-direction: column;
            font-weight: 500;
        }


        #confirm-del-popup label {
            display: flex;
            font-size: 12px;
            gap: 10px;
            font-weight: 400;
        }

        #confirm-del-checkbox {
            font-size: 12px;

        }

        #confirm-del-confirm-btn[disabled] {

            opacity: 0.5;
            cursor: not-allowed;
        }

        #confirm-del-popup::backdrop {
            /* backdrop-filter: blur(4px); */
            background-color: rgba(0, 0, 0, 0.5);

        }


        /* ════════════════════════════════════════════════════════
           ADMIN TAB: QUESTIONS — FORM
           ════════════════════════════════════════════════════════ */

        #q-form {
            width: 0;
            min-width: 0;
            opacity: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex-shrink: 0;
            border: transparent;
            border-radius: 10px;
            margin: 0;
            padding: 0;
            transition:
                width 0.3s cubic-bezier(0.075, 0.82, 0.165, 1),
                opacity 0.3s cubic-bezier(0.075, 0.82, 0.165, 1);
        }

        #q-form.active {
            width: 420px;
            opacity: 1;
            margin-left: 40px;
            margin-top: 40px;
        }

        /* form header */
        .form-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 20px;
        }

        .form-header .icon {
            width: 32px;
            height: 32px;
            background: rgb(95, 96, 101);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .form-header .icon svg {
            width: 16px;
            height: 16px;
            stroke: white;
        }

        .form-header h2 {
            font-size: 15px;
            font-weight: 600;
            color: var(--darkgreylight);
            letter-spacing: -0.02em;
        }

        /* form fields */
        .field-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
        }

        #q-form label {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            font-family: "DM Mono", monospace;
        }

        #q-text,
        #q-form select,
        #q-form input[type="text"] {
            background: transparent;
            border-radius: 5px;
            color: black;
            font-family: "DM Sans", sans-serif;
            font-size: 12px;
            outline: none;
            width: 100%;
            appearance: none;
            -webkit-appearance: none;
        }

        #q-text {
            resize: vertical;
            min-height: 88px;
            line-height: 1.6;
            max-height: 300px;
            padding: 10px 14px;
            border: solid 1px var(--greylight);
        }

        #q-text::placeholder,
        #q-form input[type="text"]::placeholder {
            color: var(--text-muted);
        }

        #q-form select {
            border: solid 1px var(--greylight);
            height: 30px;
            width: auto;
            padding-left: 10px;
            color: var(--text-muted);
        }

        #hint {
            height: 30px;
            padding-left: 10px;
            border: solid 1px var(--greylight);
        }

        /* options grid */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 8px;
            border-radius: 8px;
            padding: 8px 12px;
            background: transparent;
            border: none;
            position: relative;
        }

        .option-item:focus-within {
            border: solid 1px var(--greylight);
        }

        .option-item:focus-within input {
            border: none;
        }

        .option-item input[type="text"] {
            border: solid 1px var(--greylight);
            height: 30px;
            padding-left: 10px;
        }

        .option-badge {
            width: 22px;
            height: 22px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-muted);
            font-family: "DM Mono", monospace;
            flex-shrink: 0;
        }

        /* bottom row */
        .bottom-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 20px;
            margin-top: 30px;
        }

        /* form actions */
        .actions {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 40px;
            margin-bottom: 20px;
        }

        #q-form .btn {
            width: auto;
            font-family: "DM Sans", sans-serif;
            transition:
                opacity 0.15s,
                transform 0.1s,
                box-shadow 0.15s;
            padding: 5px 20px;
        }

        #q-form button:active {
            transform: scale(0.97);
        }

        #q-form-cancel-btn {
            border: none;
            padding: 10px 5px 10px 15px;
            background-color: transparent;
            color: var(--darkgreylight);
            margin-left: auto;
        }

        #q-form-cancel-btn:hover {
            opacity: 0.7;
        }

        #q-form-btn-clearForm:hover {
            opacity: 0.9;
            box-shadow: 4px 4px 3px rgba(68, 68, 68, 0.3);
        }

        #q-form-btn-add:hover {
            opacity: 0.9;
            box-shadow: 4px 4px 3px rgba(68, 68, 68, 0.3);
        }

        /* form errors */
        .form-err {
            color: red;
            display: none;
            position: absolute;
            font-size: 12px;
        }

        .form-err.active {
            display: flex;
        }

        .form-err.q-err {
            left: 70px;
            top: -1px;
        }

        .form-err.option-err {
            left: 60px;
            top: -1px;
        }

        .form-err.ans-err {
            left: 112px;
            top: -1px;
        }

        .form-err.cat-err {
            left: 80px;
        }

        .form-err.diff-err {
            left: 80px;
        }

        /* ════════════════════════════════════════════════════════
           ADMIN TAB: CATEGORIES
           ════════════════════════════════════════════════════════ */

        #category-tab {
            flex-direction: column;
            gap: 30px;
        }

        #category-tab .field-group {
            gap: 30px;
        }

        #add-category-btn {
            margin-left: auto;
        }

        #admin-cat-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
        }

        .admin-cat-card {
            width: 200px;
            max-width: 200px;
            height: 300px;
            display: flex;
            flex-direction: column;
            border-radius: 5px;
            font-size: 12px;
            overflow: hidden;
            gap: 20px;
            padding: 20px;
            border: solid 1px;
            position: relative;
            background-color: var(--darkgreylight);
            color: white;
            transition: transform 0.4s ease;
        }

        .admin-cat-card:hover {
            transform: scale(1.03);
        }

        .admin-cat-card.empty-card {
            flex-direction: row;
            justify-content: center;
            align-items: center;
        }

        .cat-card-img {
            width: 95%;
            height: 150px;
            object-fit: cover;
            border-radius: 3px;
            position: absolute;
            top: 5px;
            align-self: center;
        }

        #admin-cat-wrapper .field-group {
            gap: 15px;
            margin-top: 150px;
        }

        /* ════════════════════════════════════════════════════════
           MEDIA QUERIES
           ════════════════════════════════════════════════════════ */

        @media (max-width: 480px) {
            .opt-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 1110px) {
            #question-tab.active {
                flex-direction: column;
            }

            #q-form {
                border: solid 1px var(--greylight);
                transition: opacity 0.3s cubic-bezier(0.075, 0.82, 0.165, 1);
            }

            #q-form.active {
                width: 100%;
                margin-top: 30px;
                margin-left: 0;
                padding: 20px 50px;
            }

            #admin-screen,
            #admin-screen.adjust {
                max-width: 180vh;
            }
        }
    </style>
</head>

<body>
    <div id="header">
        <button id="open-modal-btn">admin</button>
    </div>

    <!-- ════════════════════════════════════════════════════════
         SCREEN: HOME
         ════════════════════════════════════════════════════════ -->
    <div class="screen active" id="home-screen">
        <h2>Test your Knowledge</h2>
        <div class="btn-container-home">
            <button class="btn play">play</button>
            <button class="btn">hi po</button>
        </div>
    </div>

    <!-- ════════════════════════════════════════════════════════
         SCREEN: CATEGORY
         ════════════════════════════════════════════════════════ -->
    <div class="screen" id="category-screen">
        <div id="category-header">
            <button class="btn back">&lt;</button>
            <h1>Categories</h1>
            <div class="wrapper" style="margin-left: auto">
                <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8" />
                    <line x1="21" y1="21" x2="16.65" y2="16.65" />
                </svg>
                <input type="text" id="category-searchBar" placeholder="search topic" />
            </div>
        </div>
        <div id="category-grid"></div>
    </div>

    <!-- ════════════════════════════════════════════════════════
         SCREEN: QUIZ
         ════════════════════════════════════════════════════════ -->
    <div class="screen" id="quiz-screen">
        <div class="quiz-header">
            <button class="btn back">&lt;</button>
            <div class="quiz-category-tag"></div>
            <div class="timer-container">
                <svg class="timer-svg" viewBox="0 0 44 44">
                    <circle class="timer-track" cx="22" cy="22" r="20" />
                    <circle class="timer-progress" cx="22" cy="22" r="20" />
                </svg>
                <span class="timer-text">0</span>
            </div>
        </div>
        <div class="question-card"></div>
    </div>

    <!-- ════════════════════════════════════════════════════════
         SCREEN: RESULT
         ════════════════════════════════════════════════════════ -->
    <div class="screen" id="result-screen">
        <div class="result-stat-row">
            <div class="result-stat">
                <div class="result-stat-val" id="res-mistakes" style="color: var(--wrong)">
                    0
                </div>
                <div class="result-stat-key">Mistakes</div>
            </div>
            <div class="result-stat center">
                <div class="result-stat-val main-score" id="res-correct" style="color: var(--correct)">
                    0
                </div>
                <div class="result-stat-key">Score</div>
            </div>
            <div class="result-stat">
                <div class="result-stat-val" id="res-accuracy" style="color: var(--accent)">
                    0%
                </div>
                <div class="result-stat-key">Accuracy</div>
            </div>
        </div>
        <div class="result-secondary">
            <span id="res-total">📋 0 Questions</span>
            <span id="res-time">⏱ 0:00</span>
        </div>
        <div class="result-actions">
            <button class="btn retry">↺ Retry</button>
            <button class="btn goCat">New Category</button>
            <button class="btn back" style="width: 200px">🏠 Home</button>
        </div>
    </div>

    <!-- ════════════════════════════════════════════════════════
         SCREEN: ADMIN
         ════════════════════════════════════════════════════════ -->
    <div class="screen active" id="admin-screen">
        <div id="admin-header">
            <h1>Work Space</h1>
            <button class="logout-btn">logout</button>
        </div>

        <div id="admin-nav">
            <button class="admin-tab active" data-tab="question">questions</button>
            <button class="admin-tab" data-tab="category">categories</button>
            <button class="admin-tab" data-tab="settings">settings</button>
        </div>

        <!-- ── TAB: QUESTIONS ───────────────────────────────── -->
        <div class="tab-panel active" id="question-tab">
            <!-- left: filters + table -->
            <div id="question-main">
                <h1>Questions</h1>

                <div class="wrapper">
                    <select class="select size--md " id="cat-filter">
                        <option value="">All categories</option>
                    </select>
                    <select class="select size--md" id="diff-filter">
                        <option value="">All difficulty</option>
                        <option value="easy">easy</option>
                        <option value="medium">medium</option>
                        <option value="hard">hard</option>
                    </select>
                    <button class="btn btn--secondary size--md show" id="add-question-btn">
                        + Add Questions
                        <span class="tooltip-fade">Add Questions</span>
                    </button>
                </div>

                <div id="table-wrapper">
                    <table id="question-table">
                        <colgroup>
                            <col style="width: 50px" />
                            <col style="width: 150px; min-width: 100px" />
                            <col style="width: 120px; min-width: 80px" />
                            <col style="width: 100px; min-width: 50px" />
                            <col style="width: auto; min-width: 220px" />
                            <col style="width: 65px; min-width: 30px" />
                        </colgroup>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Category</th>
                                <th>Difficulty</th>
                                <th>Options</th>
                                <th>Question</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="question-tbody"></tbody>
                    </table>
                </div>
            </div>

            <!-- right: form slides in -->
            <form id="q-form">
                <div class="form-header">
                    <div class="icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10" />
                            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
                            <line x1="12" y1="17" x2="12.01" y2="17" />
                        </svg>
                    </div>
                    <h2>Add Question</h2>
                    <button id="q-form-cancel-btn" type="button">X</button>
                </div>

                <p class="form-err" id="form-err-text">
                    * Field with asterisk(*) is required
                </p>

                <div class="field-group" style="margin-top: 20px">
                    <label>Question</label>
                    <textarea id="q-text" placeholder="Type your question here…"></textarea>
                    <span class="form-err q-err">*</span>
                </div>

                <div class="field-group" style="margin-top: 30px">
                    <label>Options</label>
                    <div class="options-grid">
                        <div class="option-item">
                            <span class="option-badge">A</span>
                            <input type="text" id="opt-a" placeholder="Option A" />
                        </div>
                        <div class="option-item">
                            <span class="option-badge">B</span>
                            <input type="text" id="opt-b" placeholder="Option B" />
                        </div>
                        <div class="option-item">
                            <span class="option-badge">C</span>
                            <input type="text" id="opt-c" placeholder="Option C" />
                        </div>
                        <div class="option-item">
                            <span class="option-badge">D</span>
                            <input type="text" id="opt-d" placeholder="Option D" />
                        </div>
                    </div>
                    <span class="form-err option-err">*</span>
                </div>

                <div class="bottom-row">
                    <div class="field-group">
                        <label>Difficulty</label>
                        <select id="q-diff">
                            <option value="" disabled selected>Select…</option>
                            <option value="easy">Easy</option>
                            <option value="medium">Medium</option>
                            <option value="hard">Hard</option>
                        </select>
                        <span class="form-err diff-err">*</span>
                    </div>
                    <div class="field-group">
                        <label>Correct Answer</label>
                        <select id="q-answer">
                            <option value="" disabled selected>Select…</option>
                            <option value="A">A</option>
                            <option value="B">B</option>
                            <option value="C">C</option>
                            <option value="D">D</option>
                        </select>
                        <span class="form-err ans-err">*</span>
                    </div>
                    <div class="field-group">
                        <label>Categories</label>
                        <select id="q-form-cat">
                            <option value="" disabled selected>Select…</option>
                        </select>
                        <span class="form-err cat-err">*</span>
                    </div>
                    <div class="field-group">
                        <label>Hint</label>
                        <input type="text" id="hint" placeholder="Hint (optional)" />
                        <span class="form-err">*</span>
                    </div>
                </div>

                <div class="actions">
                    <button class="btn btn--danger size--md" id="q-form-btn-clearForm" type="button">
                        Clear Form
                    </button>
                    <button class="btn btn--secondary size-md" id="q-form-btn-add" type="submit">
                        Add Question
                    </button>
                </div>
            </form>
        </div>

        <!-- ── TAB: CATEGORIES ─────────────────────────────── -->
        <div class="tab-panel" id="category-tab">
            <div class="field-group">
                <div class="wrapper">
                    <h1>Categories</h1>
                    <button class="des1" id="add-category-btn">+ add Category</button>
                </div>
                <div id="admin-cat-wrapper">
                    <div class="admin-cat-card empty-card">no category yet</div>
                </div>
            </div>
        </div>

        <!-- ── TAB: SETTINGS ───────────────────────────────── -->
        <div class="tab-panel" id="settings-tab"></div>
    </div>

    <!-- ════════════════════════════════════════════════════════
         ADMIN LOGIN MODAL
         ════════════════════════════════════════════════════════ -->
    <dialog id="admin-modal">
        <button id="admin-modal-close-btn">X</button>
        <h1>Login</h1>
        <div class="input-field">
            <label for="admin-pass-input">Password - manchild123</label>
            <input type="password" id="admin-pass-input" />
            <button id="toggle-btn" aria-label="show password">
                <svg class="eye-close" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                    <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                    <line x1="1" y1="1" x2="23" y2="23" />
                </svg>
            </button>
            <span id="admin-pass-err"></span>
        </div>
        <button id="admin-login-btn">LOGIN</button>
    </dialog>

    <!-- ════════════════════════════════════════════════════════
        Confirm Delete Modal
         ════════════════════════════════════════════════════════ -->
    <dialog id="confirm-del-popup">
        <p>Are you sure to delete this question?</p>
        <label><input type="checkbox" id="confirm-del-checkbox" /> confirm</label>
        <div class="wrapper" style="justify-content: space-between;">
            <button class="btn btn--danger size--sm" id="confirm-del-cancel-btn">
                cancel
            </button>
            <button class="btn btn--secondary size--sm" id="confirm-del-confirm-btn" disabled>
                delete
            </button>
        </div>
    </dialog>

    <script type="module" src="script.js"></script>
</body>

</html>
